name: Compiler Matchs TV (APK)

on:
  push:
    paths:
      - "tv-matchs/**"
      - ".github/workflows/matchs-tv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-matchs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        # Le SDK Android est déjà installé sur les serveurs GitHub (ANDROID_HOME).
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk MatchsTV.apk

      - name: Garder l'APK (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: MatchsTV-apk
          path: tv-matchs/MatchsTV.apk

      - name: Publier l'APK (lien de téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: matchs-tv-latest
          name: Matchs TV (dernière version)
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: tv-matchs/MatchsTV.apk
          body: |
            Application Android TV / Google TV pour regarder des chaînes à partir d'une playlist M3U.
            Lien direct de l'APK : https://github.com/${{ github.repository }}/releases/download/matchs-tv-latest/MatchsTV.apk
